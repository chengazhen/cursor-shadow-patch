[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-shadow-patch"
version = "0.1.0"
description = "Patch Cursor's main.js to force different machine IDs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "zetaloop"}
]
dependencies = [
    "pyinstaller>=5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/zetaloop/cursor-shadow-patch"
"Bug Tracker" = "https://github.com/zetaloop/cursor-shadow-patch/issues"

[project.scripts]
cursor-shadow-patch = "patcher:main"

[tool.setuptools]
py-modules = ["patcher", "_utils"]